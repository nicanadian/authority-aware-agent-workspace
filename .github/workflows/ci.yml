name: Deterministic CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-v0:
    name: deterministic v0 checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show Python version
        run: python3 --version

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile package
        run: python3 -m compileall authority_workspace

      - name: Validate JSON files
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            python3 -m json.tool "$path" >/dev/null
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

      - name: Run deterministic CLI smoke
        run: |
          set -euo pipefail
          RUN_ROOT="$(mktemp -d)/aaaw-smoke"
          python3 -m authority_workspace.cli run scenarios/fixtures/side_channel_approval.json --out "$RUN_ROOT"
          python3 -m authority_workspace.cli evaluate "$RUN_ROOT"
          test -f "$RUN_ROOT/run_report.md"
          test -f "$RUN_ROOT/authority_evaluator_report.json"
